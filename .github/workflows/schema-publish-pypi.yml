name: Publish kurrent-agent-schema to PyPI

on:
  push:
    tags:
      - 'schema-python-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only; skip publishing (for verifying the workflow without a tag).'
        type: boolean
        default: false

# Uses PyPI trusted publishing (OIDC) — no API token secret.
# The publisher must be pre-configured on https://pypi.org/manage/account/publishing/
# bound to this repo + this workflow filename + the `publish` job.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/schema-python-v')
        working-directory: schema/python
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#schema-python-v}"
          FILE_VERSION=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "tag=$TAG_VERSION file=$FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error ::tag version ($TAG_VERSION) does not match pyproject.toml version ($FILE_VERSION)"
            exit 1
          fi

      - name: Sync dependencies
        working-directory: schema/python
        run: uv sync --all-extras --frozen

      - name: Run drift tests
        working-directory: schema/python
        run: uv run pytest

      - name: Build distributions
        working-directory: schema/python
        run: uv build

      - name: Publish to PyPI (trusted publishing)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: schema/python/dist/
