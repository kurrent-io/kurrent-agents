name: Schema CI

on:
  pull_request:
    paths:
      - 'schema/**'
      - '.github/workflows/schema-ci.yml'
  push:
    branches: [main]
    paths:
      - 'schema/**'
      - '.github/workflows/schema-ci.yml'

# Cancel superseded runs on the same ref (e.g. new push to a PR branch).
concurrency:
  group: schema-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python drift tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Sync dependencies
        working-directory: schema/python
        run: uv sync --all-extras --frozen

      - name: Run drift tests
        working-directory: schema/python
        run: uv run pytest -v

  dotnet:
    name: .NET drift tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: schema/dotnet
        run: dotnet restore Kurrent.Agent.Schema.slnx

      - name: Build
        working-directory: schema/dotnet
        run: dotnet build Kurrent.Agent.Schema.slnx -c Release --no-restore

      - name: Test
        working-directory: schema/dotnet
        run: dotnet test Kurrent.Agent.Schema.slnx -c Release --no-build --verbosity normal
