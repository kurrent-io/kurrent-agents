name: Schema Python CI

on:
  pull_request:
    paths:
      - 'schema/python/**'
      - 'schema/fixtures/**'
      - '.github/workflows/schema-ci-python.yml'
  push:
    branches: [main]
    paths:
      - 'schema/python/**'
      - 'schema/fixtures/**'
      - '.github/workflows/schema-ci-python.yml'
  workflow_dispatch:

concurrency:
  group: schema-ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Drift tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Sync dependencies
        working-directory: schema/python
        run: uv sync --all-extras --frozen

      - name: Run drift tests
        working-directory: schema/python
        run: uv run pytest -v
