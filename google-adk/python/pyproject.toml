[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurrent-google-adk"
version = "0.0.1"
description = "KurrentDB integration for the Google Agent Development Kit (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kurrent, Inc." }]
keywords = ["kurrentdb", "eventsourcing", "google-adk", "llm", "agents"]
dependencies = [
  "google-adk >= 1.0.0",
  "kurrentdbclient >= 1.2.0",
  "pydantic >= 2.5",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8",
  "pytest-asyncio >= 0.23",
  "ruff >= 0.6",
  "kurrent-agents-testing",
]

[tool.hatch.build.targets.wheel]
packages = ["kurrent_google_adk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.uv.sources]
kurrent-agents-testing = { path = "../../testing", editable = true }

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
