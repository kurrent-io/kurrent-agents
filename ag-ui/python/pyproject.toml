[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurrent-ag-ui"
version = "0.0.1"
description = "AG-UI Protocol bridge for KurrentDB-backed agent sessions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kurrent, Inc." }]
keywords = ["kurrentdb", "ag-ui", "agents", "sse"]
dependencies = [
  "kurrent-agent-schema >= 0.4.0",
  "kurrentdbclient >= 1.2.0",
]

[project.optional-dependencies]
server = [
  "starlette >= 0.37",
  "sse-starlette >= 2.1",
  "uvicorn >= 0.30",
]
dev = [
  "pytest >= 8",
  "pytest-asyncio >= 0.23",
  "ruff >= 0.6",
  "httpx >= 0.27",
  "starlette >= 0.37",
  "sse-starlette >= 2.1",
  "uvicorn >= 0.30",
]

[tool.hatch.build.targets.wheel]
packages = ["kurrent_ag_ui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.uv.sources]
kurrent-agent-schema = { path = "../../schema/python", editable = true }

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
