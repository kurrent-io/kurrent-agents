[project]
name = "ag-ui-showcase-adk-runner"
version = "0.0.0"
description = "Google ADK lane runner for ag-ui-showcase"
requires-python = ">=3.11"
dependencies = [
  # ADK with the LiteLLM extra so we can route to Anthropic.
  "google-adk[extensions]",
  "kurrent-google-adk",
  "kurrent-agent-schema >= 0.4.0",
  "kurrentdbclient >= 1.2.0",
  # orjson 3.11.9 dropped Windows wheels; pin to last Windows-compatible.
  "orjson < 3.11.9",
]

[tool.uv.sources]
kurrent-agent-schema = { path = "../../../../schema/python", editable = true }
kurrent-google-adk = { path = "../../../../google-adk/python", editable = true }
