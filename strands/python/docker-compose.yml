services:
  kurrentdb:
    image: kurrentplatform/kurrentdb:26.0.2-experimental-arm64-10.0-noble
    environment:
      - KURRENTDB_CLUSTER_SIZE=1
      - KURRENTDB_RUN_PROJECTIONS=All
      - KURRENTDB_START_STANDARD_PROJECTIONS=true
      - KURRENTDB_NODE_PORT=2113
      - KURRENTDB_INSECURE=true
      - KURRENTDB_ENABLE_ATOM_PUB_OVER_HTTP=true
    ports:
      - "2113:2113"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2113/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - type: volume
        source: kurrent-strands-python-data
        target: /var/lib/kurrentdb
      - type: volume
        source: kurrent-strands-python-logs
        target: /var/log/kurrentdb

volumes:
  kurrent-strands-python-data:
  kurrent-strands-python-logs:
