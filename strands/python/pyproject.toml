[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurrent-strands"
version = "0.0.1"
description = "KurrentDB integration for Strands Agents SDK (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kurrent, Inc." }]
keywords = ["kurrentdb", "eventsourcing", "strands-agents", "llm", "agents"]
dependencies = [
  "strands-agents >= 0.45.0",
  "kurrent-agent-schema >= 0.3.0",
  "kurrentdbclient >= 1.2.0",
  "protobuf >= 6.32.1, < 8",
  "pydantic >= 2.5",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8",
  "pytest-asyncio >= 0.23",
  "ruff >= 0.6",
  "kurrent-agents-testing",
]

[tool.hatch.build.targets.wheel]
packages = ["kurrent_strands"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.uv.sources]
kurrent-agent-schema = { path = "../../schema/python", editable = true }
kurrent-agents-testing = { path = "../../testing", editable = true }
