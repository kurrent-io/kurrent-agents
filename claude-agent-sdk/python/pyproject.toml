[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurrent-claude-agent-sdk"
version = "0.0.1"
description = "KurrentDB SessionStore adapter for the Claude Agent SDK (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Kurrent, Inc." }]
keywords = ["kurrentdb", "eventsourcing", "claude-agent-sdk", "anthropic", "agents"]
dependencies = [
  # 0.1.65 is the first release exposing the ``SessionStore`` protocol and
  # the ``ClaudeAgentOptions.session_store`` kwarg this adapter plugs into.
  # Upper-bounded against 0.2 because the SDK is still in 0.x; its JSONL entry
  # shape is documented internal-and-unstable (DESIGN.md §4), so we don't want
  # downstream installs silently resolving to a breaking bump.
  "claude-agent-sdk >= 0.1.65, < 0.2",
  "kurrentdbclient >= 1.2.0",
  "pydantic >= 2.5",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8",
  "pytest-asyncio >= 0.23",
  "ruff >= 0.6",
  "kurrent-agents-testing",
]

[tool.hatch.build.targets.wheel]
packages = ["kurrent_claude_agent_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.uv.sources]
kurrent-agents-testing = { path = "../../testing", editable = true }
