[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurrent-agent-framework"
version = "0.0.1"
description = "KurrentDB integration for the Microsoft Agent Framework (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kurrent, Inc." }]
keywords = ["kurrentdb", "eventsourcing", "agent-framework", "llm"]
dependencies = [
  # Depend on the core package, not the `agent-framework` meta-package. The meta
  # package pulls in `agent-framework-azure-ai-search==0.0.0a1`, a placeholder
  # stub that ships a 0-byte `agent_framework/__init__.py` and clobbers the
  # real re-exports from agent-framework-core. See DEV-1495.
  "agent-framework-core >= 1.1.0",
  "kurrent-agent-schema >= 0.3.0",
  "kurrentdbclient >= 1.2.0",
  "protobuf >= 6.32, < 8",
  "pydantic >= 2.5",
]

[project.optional-dependencies]
dev = [
  "pytest >= 8",
  "pytest-asyncio >= 0.23",
  "ruff >= 0.6",
  "kurrent-agents-testing",
  # Required by test_workflows.py — exercises KurrentDBGroupChatRecorder
  # against GroupChatResponseReceivedEvent, which the orchestrations package
  # ships (`from agent_framework_orchestrations import ...`).
  "agent-framework-orchestrations",
]

[tool.hatch.build.targets.wheel]
packages = ["kurrent_agent_framework"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]

[tool.uv.sources]
kurrent-agent-schema = { path = "../../schema/python", editable = true }
kurrent-agents-testing = { path = "../../testing", editable = true }
