[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kurrent-agent-framework"
version = "0.0.1"
description = "KurrentDB integration for the Microsoft Agent Framework (Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kurrent, Inc." }]
keywords = ["kurrentdb", "eventsourcing", "agent-framework", "llm"]
dependencies = [
  "agent-framework >= 1.0.0",
  "kurrentdbclient >= 1.2.0",
  "pydantic >= 2.5",
]

[project.optional-dependencies]
dev = ["pytest >= 8", "pytest-asyncio >= 0.23", "ruff >= 0.6"]

[tool.hatch.build.targets.wheel]
packages = ["kurrent_agent_framework"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
